<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sector · {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=api14">
</head>
<body data-page="sector" data-slug="{{ slug }}">
  <div id="page-loader" class="page-loader" aria-live="polite" aria-busy="true">
    <div class="page-loader-inner">
      <span class="page-loader-spin" aria-hidden="true"></span>
      <p>Loading sector</p>
    </div>
  </div>
  <header class="top">
    <div>
      <p class="kicker"><a id="back-link" href="/">← {{ app_name }}</a> · sector</p>
      <h1 id="sector-title">Loading…</h1>
    </div>
  </header>

  <div class="sticky-bar hidden" id="sector-bar">
    <nav class="months" id="months" aria-label="Month"></nav>
  </div>

  <section class="hero" id="sector-hero" data-api="sector">
    <div class="panel-body"></div>
  </section>

  <script src="{{ url_for('static', filename='app.js') }}?v=api14"></script>
</body>
</html>
